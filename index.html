<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QURAN MEMORISATION — حفظ القرآن</title>
  <meta name="description" content="متابعة حفظ القرآن الكريم بتقنيات الاسترجاع النشط والتكرار المتباعد">
  <meta name="theme-color" content="#0f5132">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // إصلاح ذاتي: إن فشل تحميل التطبيق بسبب اختلاط ملفات نسخة قديمة (ذاكرة المتصفح المؤقتة بعد تحديث)،
    // نجلب الملفات من جديد ونعيد التحميل مرة واحدة
    window.__repairApp = function () {
      try { if (sessionStorage.getItem("qm-repaired")) return; sessionStorage.setItem("qm-repaired", "1"); } catch (e) { return; }
      var files = ["index.html", "css/style.css", "manifest.webmanifest", "js/main.js", "js/util.js", "js/db.js", "js/srs.js",
        "js/state.js", "js/router.js", "js/quran.js", "js/quran-meta.js", "js/views/home.js", "js/views/review.js",
        "js/views/mushaf.js", "js/views/editor.js", "js/views/detail.js", "js/views/range.js", "js/views/settings.js"];
      Promise.all(files.map(function (f) { return fetch(f, { cache: "reload" }).catch(function () {}); }))
        .then(function () { location.reload(); });
    };
    window.addEventListener("error", function (e) {
      if (e && e.filename && e.filename.indexOf("/js/") !== -1) window.__repairApp();
    });
  </script>
  <script type="module" src="js/main.js" onerror="__repairApp()"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <div>
        <h1>QURAN MEMORISATION</h1>
        <small>متابعة حفظ القرآن الكريم</small>
      </div>
    </div>
    <div class="dates">
      <span id="hijriLabel"></span>
      <span id="todayLabel"></span>
    </div>
  </header>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-review" class="view"></section>
    <section id="view-pages" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <dialog id="editorDialog" class="sheet"></dialog>
  <dialog id="detailDialog" class="sheet"></dialog>
  <dialog id="rangeDialog" class="sheet"></dialog>

  <nav class="tabbar">
    <button data-view="home"><span aria-hidden="true">🏠</span>الرئيسية</button>
    <button data-view="review"><span aria-hidden="true">🔁</span>المراجعة<em class="badge" id="navBadge" hidden></em></button>
    <button data-view="pages"><span aria-hidden="true">📚</span>المصحف</button>
    <button data-view="settings"><span aria-hidden="true">⚙️</span>الإعدادات</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
